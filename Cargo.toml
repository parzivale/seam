[workspace]
resolver = "3"
members = ["crates/seam", "crates/seam-core", "crates/seam-std", "crates/seam-test", "crates/seam-tokio"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/parzivale/seam"
keywords = ["effects", "capabilities", "sans-io", "testing", "simulation"]
categories = ["no-std", "asynchronous", "development-tools::testing"]

[workspace.dependencies]
seam-core = { package = "seam-rs-core", path = "crates/seam-core", version = "0.4.0", default-features = false }
seam-std = { package = "seam-rs-std", path = "crates/seam-std", version = "0.4.0", default-features = false }
seam-test = { package = "seam-rs-test", path = "crates/seam-test", version = "0.4.0", default-features = false }
seam-tokio = { package = "seam-rs-tokio", path = "crates/seam-tokio", version = "0.4.0", default-features = false }
tokio = { version = "1.54", default-features = false }

[workspace.lints.rust]
# Forbidden in every crate root but seam-std, which allows it only where it
# must: changing the process environment.
unsafe_code = "deny"
missing_docs = "warn"
