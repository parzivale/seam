[package]
name = "seam-rs-ash"
description = "Vulkan for seam: buffers, images and programs as scopes, uploads, draws and dispatches as effects, with synchronization worked out for you; over ash, sync and async, and simulated for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
seam-core = { workspace = true, features = ["std"] }
# `loaded`: the Vulkan loader is opened at run time, so building needs no
# Vulkan SDK.
ash = { workspace = true, features = ["std", "loaded", "debug"], optional = true }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
default = ["ash"]
# `Ash`: real Vulkan, through ash.
ash = ["dep:ash"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "seam_ash"

[lints]
workspace = true
