[package]
name = "seam-rs-ash"
description = "Vulkan for seam: buffers, images and programs as scopes, uploads, draws and dispatches as effects, with synchronization worked out for you; over ash, sync and async, and simulated for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
seam-core = { workspace = true, features = ["std"] }
# The windows a swapchain presents to.
raw-window-handle = { workspace = true }
# `loaded`: the Vulkan loader is opened at run time, so building needs no
# Vulkan SDK.
ash = { workspace = true, features = ["std", "loaded", "debug"], optional = true }

[target.'cfg(unix)'.dependencies]
# Waiting on a dmabuf's implicit fences (`poll`), and its size.
rustix = { workspace = true, features = ["std", "event", "fs"], optional = true }

[dev-dependencies]
seam-smol = { workspace = true }
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }
# Shaders in Rust: their SPIR-V for `Ash`, their functions for `SimGpu`.
seam-ash-shaders = { path = "shaders" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(unix)'.dev-dependencies]
# memfds as fake dmabufs.
rustix = { workspace = true, features = ["std", "fs"] }

[features]
default = ["ash"]
# `Ash`: real Vulkan, through ash.
ash = ["dep:ash", "dep:rustix"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin"]

[lib]
name = "seam_ash"

[lints]
workspace = true
