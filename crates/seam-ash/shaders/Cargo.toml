[package]
name = "seam-ash-shaders"
description = "Shaders in Rust, through rust-gpu, for seam-ash's tests and seam's examples: compiled to SPIR-V for the GPU, and as plain Rust for SimGpu's emulators."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
spirv-std = "0.11.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }
