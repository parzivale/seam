[package]
name = "seam-rs-core"
description = "Sans-effect capability traits and operation types. no_std."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Operation types whose outcomes need std (io::Error, Path, ...).
std = ["alloc"]
# `Spawn::boxed` and `SpawnWith::boxed`, for tasks of unnameable type.
alloc = []

# Capability groups. Groups whose operation types need std turn it on.
fs = ["std", "io"]
net = ["std", "io"]
process = ["std"]
env = ["std"]
io-std = ["std"]
signal = ["std"]
# `time` and `random` are usable without std. With `std`, `time` also
# gains `WallClock`.
time = []
random = []
# Spawning and joining tasks. No std needed.
rt = []

# Handle-level read/write/flush operations. Pulled in by `fs` and `net`.
io = ["std"]

full = ["fs", "net", "process", "env", "io-std", "signal", "time", "random", "rt"]

[package.metadata.docs.rs]
all-features = true

# Published as `seam-rs-core`; code still refers to it as `seam_core`.
[lib]
name = "seam_core"

[lints]
workspace = true
