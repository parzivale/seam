[package]
name = "seam-rs-core"
description = "Sans-effect capability traits and operation types. no_std."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Operation types whose outcomes need std (io::Error, Path, ...).
std = ["alloc"]
# The helpers that return owned data (`read_to_end`, `read_file`,
# `resolve`, ...), and `Spawn::boxed` and `SpawnWith::boxed`, for tasks of
# unnameable type.
alloc = []

# Capability groups. Groups whose operation types need std (`Path`,
# `OsString`, `Command`) turn it on; the rest need none, and the few of
# their operations that return owned data need only `alloc`.
fs = ["std", "io"]
net = ["io"]
process = ["std", "io"]
env = ["std"]
# Standard input, output and error, as handles for the `io` operations.
io-std = ["io"]
signal = []
# `time` and `random` are usable without std. With `std`, `time` also
# gains `WallClock`.
time = []
random = []
# Spawning and joining tasks. No std needed.
rt = []
# Channels and shared cells. No std needed. `time` for `try_send` and
# `try_recv`, which are a timeout of zero.
sync = ["time"]

# Handle-level read, write, flush and seek. Pulled in by `fs`, `net`,
# `process` and `io-std`. No std needed; `read_to_end` needs `alloc`.
io = []

full = ["fs", "net", "process", "env", "io-std", "signal", "time", "random", "rt", "sync"]

[package.metadata.docs.rs]
all-features = true

# Published as `seam-rs-core`; code still refers to it as `seam_core`.
[lib]
name = "seam_core"

[lints]
workspace = true
