[package]
name = "seam-rs-rand"
description = "rand for seam: any FillRandom capability as a rand RNG, so rand's distributions run on seam's randomness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
seam-core = { workspace = true, features = ["random"] }
# No default features: rand's own `rng()` and `random()` read the
# system's randomness, an effect this crate performs through seam instead.
# The pure generators and `alloc` (for `seq`); no `thread_rng` or `sys_rng`,
# which read the system.
rand = { workspace = true, features = ["alloc", "std_rng", "chacha"] }

[dev-dependencies]
seam-core = { workspace = true, features = ["random"] }
seam-std = { workspace = true, features = ["random"] }
seam-test = { workspace = true, features = ["random"] }

[features]
default = []
# `seeded::<rand::rngs::StdRng>`: rand's `StdRng`, seeded once from seam.
std_rng = ["rand/std_rng"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "seam_rand"

[lints]
workspace = true
