[package]
name = "seam-rs-tokio"
description = "Tokio backend for seam: async implementations of seam operations over Tokio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
seam-core = { workspace = true, features = ["std"] }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "fs", "net", "time", "io-util"] }

# Feature names follow Tokio's. Each one turns on the Tokio feature of the
# same name and the matching seam-core operation types.
[features]
default = []
full = ["fs", "net", "time", "process", "io-std", "signal", "sync", "rt", "rt-multi-thread"]

rt = ["tokio/rt", "seam-core/rt"]
rt-multi-thread = ["rt", "tokio/rt-multi-thread"]
io-util = ["tokio/io-util"]
fs = ["tokio/fs", "tokio/rt", "io-util", "seam-core/fs"]
net = ["tokio/net", "io-util", "seam-core/net"]
time = ["tokio/time", "seam-core/time"]
process = ["tokio/process", "io-util", "seam-core/process"]
io-std = ["tokio/io-std", "io-util", "rt", "seam-core/io-std"]
signal = ["tokio/signal", "seam-core/signal"]
# `time` too: `try_send` and `try_recv` are a timeout of zero.
sync = ["time", "tokio/sync", "seam-core/sync"]
test-util = ["tokio/test-util"]


[package.metadata.docs.rs]
all-features = true

# Published as `seam-rs-tokio`; code still refers to it as `seam_tokio`.
[lib]
name = "seam_tokio"

[lints]
workspace = true
