[package]
name = "seam-rs"
description = "Sans-effect programming: hoist every effect out of the core, behind capability traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
seam-core = { workspace = true }
seam-std = { workspace = true, optional = true }
seam-test = { workspace = true, optional = true }
seam-tokio = { workspace = true, optional = true }

# `seam` is no_std by default: only the traits, `Push` and the no_std
# operation types. std is pulled in when you enable a capability whose
# operation types need it, or a backend.
[features]
default = []

# Backends. Nothing else turns these on: picking where effects really
# happen is always the end user's choice.
std = ["dep:seam-std"]
tokio = ["dep:seam-tokio"]
test = ["dep:seam-test"]

# Capability groups. Each enables its operation types and, in whichever
# backends are on, their implementations. None of them enables a backend.
# Those whose types need std (`io::Error`, `Path`, ...) link std, but a
# core using only them still performs no effects of its own.
fs = ["seam-core/fs", "seam-std?/fs", "seam-tokio?/fs", "seam-test?/fs"]
net = ["seam-core/net", "seam-std?/net", "seam-tokio?/net", "seam-test?/net"]
process = ["seam-core/process", "seam-std?/process", "seam-tokio?/process", "seam-test?/process"]
env = ["seam-core/env", "seam-std?/env", "seam-tokio?/env", "seam-test?/env"]
io-std = ["seam-core/io-std", "seam-std?/io-std", "seam-tokio?/io-std", "seam-test?/io-std"]
signal = ["seam-core/signal", "seam-tokio?/signal", "seam-test?/signal"]
# Channels and shared cells. No std needed for the operation types.
sync = ["seam-core/sync", "seam-std?/sync", "seam-tokio?/sync", "seam-test?/sync"]
# Usable without std: `Sleep`, `Now`, `RandomU64`, `FillRandom`, and the
# task operations (`Spawn`, `Join`, ...). In the Tokio backend, `rt` also
# turns on Tokio's runtime, as in Tokio; with `test`, it adds the simulated
# runtime, which needs std.
time = ["seam-core/time", "seam-std?/time", "seam-tokio?/time", "seam-test?/time"]
random = ["seam-core/random", "seam-std?/random", "seam-tokio?/random", "seam-test?/random"]
rt = ["seam-core/rt", "seam-std?/rt", "seam-tokio?/rt", "seam-test?/rt"]
# `Spawn::boxed` and `SpawnWith::boxed`, for tasks of unnameable type.
alloc = ["seam-core/alloc"]

# Every capability group. Still no backend.
full = ["fs", "net", "process", "env", "io-std", "signal", "time", "random", "rt", "sync", "alloc"]

# Tokio runtime options, named as in Tokio. They configure the Tokio
# backend and do nothing unless `tokio` is also enabled.
rt-multi-thread = ["rt", "seam-tokio?/rt-multi-thread"]
test-util = ["seam-tokio?/test-util"]

[package.metadata.docs.rs]
all-features = true

# Published as `seam-rs`; code still refers to it as `seam`.
[lib]
name = "seam"

[lints]
workspace = true

# Each example's tests run its core against `seam::test::Sim`.
[[example]]
name = "guess"
required-features = ["std", "test", "io-std", "random"]
test = true

[[example]]
name = "backup"
required-features = ["std", "test", "fs", "env", "time", "io-std"]
test = true

[[example]]
name = "echo_server"
required-features = ["tokio", "rt", "rt-multi-thread", "net", "env", "io-std", "test"]
test = true

[[example]]
name = "custom_ops"
required-features = ["std", "test", "fs", "env"]
test = true

[[example]]
name = "word_count"
required-features = ["std", "test", "fs", "env", "io-std", "rt", "sync"]
test = true
