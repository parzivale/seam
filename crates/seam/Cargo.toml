[package]
name = "seam-rs"
description = "Sans-effect programming: hoist every effect out of the core, behind capability traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
seam-core = { workspace = true }
seam-futures = { workspace = true, optional = true }
seam-jiff = { workspace = true, optional = true }
seam-ash = { workspace = true, optional = true }
seam-dirs = { workspace = true, optional = true }
seam-nix = { workspace = true, optional = true }
seam-notify = { workspace = true, optional = true }
seam-rand = { workspace = true, optional = true }
seam-reqwest = { workspace = true, optional = true }
seam-rustix = { workspace = true, optional = true }
seam-smol = { workspace = true, optional = true }
seam-sqlx = { workspace = true, optional = true }
seam-tracing = { workspace = true, optional = true }
seam-unix = { workspace = true, optional = true }
seam-uuid = { workspace = true, optional = true }
seam-std = { workspace = true, optional = true }
seam-test = { workspace = true, optional = true }
seam-tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# For the examples: `import_log` prints through a subscriber, and
# `gpu_double` runs a Rust shader on the GPU and in the simulation.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
seam-ash-shaders = { path = "../seam-ash/shaders" }

# `seam` is no_std by default: only the traits, `Push` and the no_std
# operation types. std is pulled in when you enable a capability whose
# operation types need it, or a handler crate.
[features]
default = []

# The guides and background in `seam::_docs`: documentation only, off by
# default so it costs nothing to build. docs.rs builds it (all features).
docs = []

# Handler crates. Nothing else turns these on: picking where effects really
# happen is always the end user's choice.
std = ["dep:seam-std"]
tokio = ["dep:seam-tokio"]
futures = ["dep:seam-futures"]
# Time zones as effects, over jiff: `seam::jiff`. Brings in the `fs`, `env`
# and `time` operation types it is built on. `jiff-bundled` adds `Bundled`,
# the tz database compiled in.
jiff = ["dep:seam-jiff", "fs", "env", "time"]
jiff-bundled = ["jiff", "seam-jiff?/bundled"]
# The smol handler, `seam::smol`: like `tokio`, an async handler for time,
# files, the network, stdio, processes, Ctrl-C, tasks and channels.
smol = ["dep:seam-smol", "seam-sqlx?/smol"]
# Wrappers of popular crates, each its own effects with a real handler
# and one for tests. Each brings in the operation types it is built on.
rand = ["dep:seam-rand", "random"]
uuid = ["dep:seam-uuid", "random", "time", "std", "seam-test?/std"]
dirs = ["dep:seam-dirs", "env", "fs"]
tracing = ["dep:seam-tracing"]
notify = ["dep:seam-notify", "seam-notify?/notify", "fs", "time"]
reqwest = ["dep:seam-reqwest", "seam-reqwest?/reqwest", "seam-reqwest?/rustls"]
sqlx = ["dep:seam-sqlx", "seam-sqlx?/sqlite", "seam-sqlx?/tokio"]
# The GPU as effects, over Vulkan (`seam::ash`): buffers, images and
# programs as scopes, uploads, draws and dispatches, synchronization worked
# out by the handler. `SimGpu` simulates it.
ash = ["dep:seam-ash", "seam-ash?/ash"]
# Unix effects (`seam::unix`), and their handlers over rustix and nix.
unix = ["dep:seam-unix", "fs"]
rustix = ["unix", "dep:seam-rustix"]
nix = ["unix", "dep:seam-nix"]
test = ["dep:seam-test", "seam-tracing?/test", "seam-unix?/test", "seam-reqwest?/test"]

# Capability groups. Each enables its operation types and, in whichever
# handler crates are on, their implementations. None of them enables a
# handler crate.
# Those whose types need std (`io::Error`, `Path`, ...) link std, but a
# core using only them still performs no effects of its own.
fs = ["seam-core/fs", "seam-std?/fs", "seam-tokio?/fs", "seam-test?/fs", "seam-futures?/fs", "seam-smol?/fs"]
net = ["seam-core/net", "seam-std?/net", "seam-tokio?/net", "seam-test?/net", "seam-futures?/net", "seam-smol?/net"]
process = ["seam-core/process", "seam-std?/process", "seam-tokio?/process", "seam-test?/process", "seam-futures?/process", "seam-smol?/process"]
env = ["seam-core/env", "seam-std?/env", "seam-test?/env"]
io-std = ["seam-core/io-std", "seam-std?/io-std", "seam-tokio?/io-std", "seam-test?/io-std", "seam-smol?/io-std"]
signal = ["seam-core/signal", "seam-tokio?/signal", "seam-test?/signal", "seam-smol?/signal"]
# Channels and shared cells. No std needed for the operation types.
sync = ["seam-core/sync", "seam-std?/sync", "seam-tokio?/sync", "seam-test?/sync", "seam-futures?/sync", "seam-smol?/sync"]
# Usable without std: `Sleep`, `Now`, `RandomU64`, `FillRandom`, and the
# task operations (`Spawn`, `Join`, ...). In the Tokio handler, `rt` also
# turns on Tokio's runtime, as in Tokio; with `test`, it adds the simulated
# runtime, which needs std.
time = ["seam-core/time", "seam-std?/time", "seam-tokio?/time", "seam-test?/time", "seam-futures?/time", "seam-smol?/time"]
random = ["seam-core/random", "seam-std?/random", "seam-test?/random"]
rt = ["seam-core/rt", "seam-std?/rt", "seam-tokio?/rt", "seam-test?/rt", "seam-futures?/rt", "seam-smol?/rt"]
# `Spawn::boxed` and `SpawnWith::boxed`, for tasks of unnameable type.
alloc = ["seam-core/alloc"]
# Handle-level read/write operations alone; `fs`, `net` and `process` pull
# them in.
io = ["seam-core/io", "seam-futures?/io"]

# Every capability group. Still no handler crate.
full = ["fs", "net", "process", "env", "io-std", "signal", "time", "random", "rt", "sync", "alloc"]

# Tokio runtime options, named as in Tokio. They configure the Tokio
# handler and do nothing unless `tokio` is also enabled.
rt-multi-thread = ["rt", "seam-tokio?/rt-multi-thread"]
test-util = ["seam-tokio?/test-util"]

[[example]]
name = "dice"
required-features = ["std", "test", "rand", "env"]
test = true

[[example]]
name = "ids"
required-features = ["std", "test", "uuid"]
test = true

[[example]]
name = "settings"
required-features = ["std", "test", "dirs"]
test = true

[[example]]
name = "world_clock"
required-features = ["std", "test", "jiff-bundled"]
test = true

[[example]]
name = "shared_dir"
required-features = ["std", "test", "rustix", "env"]
test = true

[[example]]
name = "import_log"
required-features = ["std", "test", "tracing"]
test = true

[[example]]
name = "todo"
required-features = ["std", "test", "sqlx", "tokio", "rt"]
test = true

[[example]]
name = "titles"
required-features = ["std", "test", "reqwest", "tokio", "rt"]
test = true

[[example]]
name = "changes"
required-features = ["std", "test", "notify"]
test = true

[[example]]
name = "checksums"
required-features = ["std", "test", "smol", "fs", "rt"]
test = true

[[example]]
name = "word_pipe"
required-features = ["std", "test", "futures", "smol", "sync", "time", "rt"]
test = true

[[example]]
name = "gpu_double"
required-features = ["std", "test", "ash"]
test = true

[package.metadata.docs.rs]
all-features = true

# Published as `seam-rs`; code still refers to it as `seam`.
[lib]
name = "seam"

[lints]
workspace = true

# Each example's tests run its core against `seam::test::Sim`.
[[example]]
name = "guess"
required-features = ["std", "test", "io-std", "random"]
test = true

[[example]]
name = "backup"
required-features = ["std", "test", "fs", "env", "time", "io-std"]
test = true

[[example]]
name = "echo_server"
required-features = ["tokio", "std", "rt", "rt-multi-thread", "net", "env", "io-std", "test", "time"]
test = true

[[example]]
name = "custom_ops"
required-features = ["std", "test", "fs", "env"]
test = true

[[example]]
name = "word_count"
required-features = ["std", "test", "fs", "env", "io-std", "rt", "sync"]
test = true
