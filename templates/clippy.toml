# Copy into a crate that should stay sans-effect. It bans reaching around
# seam to std or Tokio directly, so every effect has to arrive as a
# capability bound. Backends and wrappers (seam-std, seam-tokio, seam-smol, seam-futures,
# seam-jiff, ...) must not use this file.
disallowed-types = [
    { path = "std::fs::File", reason = "take `Provide<Open<M, F>>` instead" },
    { path = "std::fs::OpenOptions", reason = "take `Provide<Open<M, F>>` instead" },
    { path = "std::net::TcpStream", reason = "take `Perform<TcpConnect<S>>` instead" },
    { path = "std::net::TcpListener", reason = "take `Perform<TcpBind<L>>` instead" },
    { path = "std::net::UdpSocket", reason = "take `Perform<UdpBind<U>>` instead" },
    { path = "std::process::Child", reason = "take `Perform<RunCommand>`, or `Provide<SpawnChild<C>>` to talk to it, instead" },
    { path = "std::hash::RandomState", reason = "take `Perform<FillRandom>` (and `random_u64`) instead" },
    { path = "std::cell::Cell", reason = "shared state is an effect: take `Perform<Share<T, C>>` and use the cell" },
    { path = "std::cell::RefCell", reason = "shared state is an effect: take `Perform<Share<T, C>>` and use the cell" },
    { path = "std::rc::Rc", reason = "shared state is an effect: take `Perform<Share<T, C>>` and clone the cell" },
    { path = "std::sync::Arc", reason = "shared state is an effect: take `Perform<Share<T, C>>` and clone the cell" },
    { path = "std::sync::Mutex", reason = "shared state is an effect: take `Perform<Share<T, C>>` and use `Update`" },
    { path = "std::sync::RwLock", reason = "shared state is an effect: take `Perform<Share<T, C>>` and use `Load`/`Update`" },
    { path = "std::sync::mpsc::Sender", reason = "take `Perform<Channel<S, R>>` instead" },
    { path = "std::sync::mpsc::Receiver", reason = "take `Perform<Channel<S, R>>` instead" },
    { path = "tokio::fs::File", reason = "take `AsyncProvide<Open<M, F>>` instead" },
    { path = "tokio::net::TcpStream", reason = "take `SendPerform<TcpConnect<S>>` instead" },
    { path = "smol::fs::File", reason = "take `AsyncProvide<Open<M, F>>` instead" },
    { path = "smol::net::TcpStream", reason = "take `SendPerform<TcpConnect<S>>` instead" },
    { path = "tokio::net::TcpListener", reason = "take `SendPerform<TcpBind<L>>` instead" },
    { path = "tokio::net::UdpSocket", reason = "take `SendPerform<UdpBind<U>>` instead" },
]
disallowed-methods = [
    { path = "std::fs::read", reason = "use `seam::ops::fs::read_file` instead" },
    { path = "std::fs::read_to_string", reason = "use `seam::ops::fs::read_to_string` instead" },
    { path = "std::fs::write", reason = "use `seam::ops::fs::write_file` instead" },
    { path = "std::fs::metadata", reason = "take `Inspect<Metadata>` instead" },
    { path = "std::fs::read_dir", reason = "acquire `ReadDir` and perform `NextEntry` instead" },
    { path = "std::fs::create_dir", reason = "take `Perform<CreateDir>` instead" },
    { path = "std::fs::create_dir_all", reason = "use `seam::ops::fs::create_dir_all` instead" },
    { path = "std::fs::remove_file", reason = "take `Perform<RemoveFile>` instead" },
    { path = "std::fs::remove_dir", reason = "take `Perform<RemoveDir>` instead" },
    { path = "std::fs::remove_dir_all", reason = "take `Perform<RemoveDir>` instead" },
    { path = "std::fs::rename", reason = "take `Perform<Rename>` instead" },
    { path = "std::fs::copy", reason = "take `Perform<CopyFile>` instead" },
    { path = "std::time::Instant::now", reason = "take `Inspect<Now>` instead" },
    { path = "std::time::SystemTime::now", reason = "take `Inspect<WallClock>` instead" },
    { path = "std::thread::sleep", reason = "take `Perform<Sleep>` instead" },
    { path = "std::env::var", reason = "take `Inspect<Var>` instead" },
    { path = "std::env::var_os", reason = "take `Inspect<Var>` instead" },
    { path = "std::env::args", reason = "take `Inspect<Args>` instead" },
    { path = "std::env::args_os", reason = "take `Inspect<Args>` instead" },
    { path = "std::env::current_dir", reason = "take `Inspect<CurrentDir>` instead" },
    { path = "std::env::temp_dir", reason = "take `Inspect<TempDir>` instead" },
    { path = "std::env::set_var", reason = "take `Perform<SetVar>` instead" },
    { path = "std::env::remove_var", reason = "take `Perform<RemoveVar>` instead" },
    { path = "std::process::exit", reason = "take `Perform<Exit>` instead" },
    { path = "std::io::stdin", reason = "take `Provide<OpenStdin<H>>` instead" },
    { path = "std::io::stdout", reason = "take `Provide<OpenStdout<H>>` instead" },
    { path = "std::io::stderr", reason = "take `Provide<OpenStderr<H>>` instead" },
    { path = "tokio::time::sleep", reason = "take `SendPerform<Sleep>` instead" },
    { path = "tokio::time::Instant::now", reason = "take `Inspect<Now>` instead" },
    { path = "tokio::spawn", reason = "spawning is an effect" },
    { path = "futures::executor::ThreadPool::new", reason = "spawning threads is an effect; take `Spawn` (seam-futures' `Executor`) instead" },
    { path = "jiff::Timestamp::now", reason = "use `seam_jiff::timestamp` instead" },
    { path = "jiff::Zoned::now", reason = "use `seam_jiff::now_local` instead" },
    { path = "jiff::tz::TimeZone::system", reason = "take `Inspect<seam_jiff::SystemTimeZone>` instead" },
    { path = "jiff::tz::TimeZone::try_system", reason = "take `Inspect<seam_jiff::SystemTimeZone>` instead" },
    { path = "jiff::tz::TimeZone::get", reason = "take `Inspect<seam_jiff::TimeZoneFor>` instead" },
    { path = "jiff::tz::db", reason = "take `Inspect<seam_jiff::TimeZoneFor>` instead" },
    { path = "rand::rng", reason = "use `seam_rand::rng` over `Perform<FillRandom>` instead" },
    { path = "rand::random", reason = "use `seam_rand::rng` over `Perform<FillRandom>` instead" },
    { path = "rand::make_rng", reason = "use `seam_rand::seeded` instead" },
    { path = "uuid::Uuid::new_v4", reason = "use `seam_uuid::new_v4` instead" },
    { path = "uuid::Uuid::now_v7", reason = "use `seam_uuid::new_v7` instead" },
    { path = "dirs::home_dir", reason = "use `seam_dirs::dir(c, Dir::Home)` instead" },
    { path = "dirs::config_dir", reason = "use `seam_dirs::dir(c, Dir::Config)` instead" },
    { path = "dirs::cache_dir", reason = "use `seam_dirs::dir(c, Dir::Cache)` instead" },
    { path = "dirs::data_dir", reason = "use `seam_dirs::dir(c, Dir::Data)` instead" },
    { path = "notify::recommended_watcher", reason = "acquire `seam_notify::Watch` instead" },
    { path = "reqwest::get", reason = "take `Perform<seam_reqwest::Fetch>` instead" },
    { path = "reqwest::Client::execute", reason = "take `Perform<seam_reqwest::Fetch>` instead" },
    { path = "reqwest::RequestBuilder::send", reason = "take `Perform<seam_reqwest::Fetch>` instead" },
    { path = "sqlx::Pool::connect", reason = "take `seam_sqlx::Execute`/`Fetch` bounds; connect in the edge" },
    { path = "smol::spawn", reason = "spawning is an effect" },
    { path = "smol::Timer::after", reason = "take `SendPerform<Sleep>` instead" },
    { path = "rustix::mount::mount", reason = "take `Perform<seam_unix::Mount>` instead" },
    { path = "rustix::mount::mount_bind", reason = "take `Perform<seam_unix::Mount>` instead" },
    { path = "rustix::mount::unmount", reason = "take `Perform<seam_unix::Unmount>` instead" },
    { path = "rustix::process::kill_process", reason = "take `Perform<seam_unix::Kill>` instead" },
    { path = "nix::mount::mount", reason = "take `Perform<seam_unix::Mount>` instead" },
    { path = "nix::mount::umount", reason = "take `Perform<seam_unix::Unmount>` instead" },
    { path = "nix::mount::umount2", reason = "take `Perform<seam_unix::Unmount>` instead" },
    { path = "nix::sys::signal::kill", reason = "take `Perform<seam_unix::Kill>` instead" },
    { path = "nix::unistd::chown", reason = "take `Perform<seam_unix::Chown>` instead" },
    { path = "ash::Entry::load", reason = "take the `seam_ash` operations instead" },
    { path = "ash::Entry::linked", reason = "take the `seam_ash` operations instead" },
]
disallowed-macros = [
    { path = "std::println", reason = "use `seam::ops::stdio::println` instead" },
    { path = "std::print", reason = "use `seam::ops::stdio::print` instead" },
    { path = "std::eprintln", reason = "use `seam::ops::stdio::eprintln` instead" },
    { path = "std::eprint", reason = "take `Provide<OpenStderr<H>>` instead" },
    { path = "std::dbg", reason = "writes to stderr" },
]
